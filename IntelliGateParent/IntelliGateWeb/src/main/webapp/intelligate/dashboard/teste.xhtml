<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>PrimeFaces Example</title>
</h:head>
<h:body>
    <!-- Primeira Seção -->
    <h:panelGroup layout="block" styleClass="ui-g">
        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-4">
            <p:card>
                <h:panelGrid columns="1">
                    <h:outputLabel value="Label 1" />
                    <h:outputLabel value="Label 2" />
                </h:panelGrid>
            </p:card>
        </h:panelGroup>
        
        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-4">
            <p:card>
                <h:panelGrid columns="1">
                    <h:outputLabel value="Label 1" />
                    <h:outputLabel value="Label 2" />
                </h:panelGrid>
            </p:card>
        </h:panelGroup>
        
        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-4">
            <p:card>
                <h:panelGrid columns="1">
                    <p:progressBar value="50" style="margin-bottom:10px" />
                    <p:progressBar value="75" />
                </h:panelGrid>
            </p:card>
        </h:panelGroup>
    </h:panelGroup>

    <!-- Seção do Meio -->
    <h:panelGroup layout="block" styleClass="ui-g">
        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6">
            <p:lineChart id="lineChart" value="#{chartView.lineModel}" style="height:300px" />
        </h:panelGroup>
        
        <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6">
            <p:barChart id="barChart1" value="#{chartView.barModel1}" style="height:150px" />
            <p:barChart id="barChart2" value="#{chartView.barModel2}" style="height:150px" styleClass="ui-mt-3" />
        </h:panelGroup>
    </h:panelGroup>

    <!-- Terceira Seção -->
    <h:panelGroup layout="block" styleClass="ui-g">
        <h:panelGrid columns="3" styleClass="ui-g-12">
            <h:outputLabel value="Column 1" />
            <h:outputLabel value="Column 2" />
            <h:outputLabel value="Column 3" />
            <!-- Adicione mais conteúdo conforme necessário -->
        </h:panelGrid>
    </h:panelGroup>
</h:body>
</html>
