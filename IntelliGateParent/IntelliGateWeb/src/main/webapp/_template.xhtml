<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>IntelliGate</title>
    <style>
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            text-align: center;
            padding: 0px 50px;
        }
        .highlight-number {
            font-size: 2em;
            font-weight: bold;
        }
        .separator {
            border-left: 1px solid #ccc;
            height: 100px;
        }
	    .logo-menuitem {
	        display: flex;
	        align-items: center;
	    }
	    
	    .logo-image {
	        max-height: 60px; /* Ajuste conforme necessário */
	        max-width: 100%; /* Para garantir que a largura não ultrapasse o container */
	        height: auto; /* Manter proporção */
	        width: auto; /* Manter proporção */
	    }
	
	    @media (max-width: 768px) {
	        .logo-image {
	            max-height: 30px; /* Ajuste conforme necessário para telas menores */
	        }
	    }
   </style>
</h:head>

<h:body>

	<div id="cabecalho">

		<h:form>
			<p:growl id="messages"/>
			<p:menubar>
            	<p:menuitem action="/index?faces-redirect=true" styleClass="logo-menuitem">
                	<h:graphicImage library="images" name="intelligate-logo.png" styleClass="logo-image" />
				</p:menuitem>

	            <p:divider layout="vertical"/>
			
				<p:submenu label="Cadastros" icon="pi pi-fw pi-bars">
					<p:menuitem value="Usuários" icon="pi pi-fw pi-users"
						action="/intelligate/usuario/listagemUsuario?faces-redirect=true" />
					<p:menuitem value="Pessoas" icon="pi pi-fw pi-id-card"
						action="/intelligate/pessoa/listagemPessoa?faces-redirect=true" />
					<p:menuitem value="Veículos" icon="pi pi-fw pi-car"
						action="/intelligate/veiculo/listagemVeiculo?faces-redirect=true" />
					<p:menuitem value="Leitores" icon="pi pi-fw pi-sitemap"
						action="/intelligate/leitor/listagemLeitor?faces-redirect=true" />
				</p:submenu>
				
	            <p:divider layout="vertical"/>
	            
       			<p:menuitem value="Logout" icon="pi pi-fw pi-sign-out"
					action="#{loginManager.logout}" process="@this" />
			</p:menubar>
			<br />
		</h:form>
	</div>

	<div id="conteudo">

		<ui:insert name="conteudo" />

	</div>


	<!-- TODO adicionar um footer -->


</h:body>


</html>
